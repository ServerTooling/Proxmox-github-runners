# The system libraries `npx playwright install-deps chromium firefox` would install, so jobs can run
# Playwright browsers without root (runners have no sudo). From Playwright 1.62.1's nativeDeps,
# ubuntu24.04-x64: tools, chromium and firefox. Re-sync when a newer Playwright adds libraries.
- name: Install Playwright browser dependencies (Chromium, Firefox)
  ansible.builtin.apt:
    name:
      # tools: virtual display and fonts
      - xvfb
      - fonts-noto-color-emoji
      - fonts-unifont
      - libfontconfig1
      - libfreetype6
      - xfonts-cyrillic
      - xfonts-scalable
      - fonts-liberation
      - fonts-ipafont-gothic
      - fonts-wqy-zenhei
      - fonts-tlwg-loma-otf
      - fonts-freefont-ttf
      # chromium
      - libasound2t64
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libatspi2.0-0t64
      - libcairo2
      - libcups2t64
      - libdbus-1-3
      - libdrm2
      - libgbm1
      - libglib2.0-0t64
      - libnspr4
      - libnss3
      - libpango-1.0-0
      - libx11-6
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxkbcommon0
      - libxrandr2
      # firefox (beyond the above)
      - libavcodec60
      - libcairo-gobject2
      - libgdk-pixbuf-2.0-0
      - libgtk-3-0t64
      - libpangocairo-1.0-0
      - libx11-xcb1
      - libxcb-shm0
      - libxcursor1
      - libxi6
      - libxrender1
    state: present
    install_recommends: false
