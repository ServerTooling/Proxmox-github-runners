# The system libraries Playwright's browsers need, installed by Playwright itself so the list always
# matches what it asks for. A job's `npx playwright install --with-deps` then finds them present (it
# can also install more itself: the runner has passwordless sudo).
- name: Install Playwright browser dependencies (Chromium, Firefox)
  ansible.builtin.command: npx -y playwright@{{ playwright_version }} install-deps chromium firefox
  changed_when: true
