- name: Resolve Node.js LTS
  ansible.builtin.uri:
    url: https://nodejs.org/dist/index.json
    return_content: true
  register: node_index
  when: node_version == 'lts'

- name: Node version
  ansible.builtin.set_fact:
    node_resolved: "{{ (node_index.json | selectattr('lts') | first).version if node_version == 'lts' else node_version }}"
    node_arch: "{{ 'x64' if arch == 'amd64' else 'arm64' }}"

- name: Download Node.js
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/{{ node_resolved }}/node-{{ node_resolved }}-linux-{{ node_arch }}.tar.xz"
    checksum: "sha256:https://nodejs.org/dist/{{ node_resolved }}/SHASUMS256.txt"
    dest: /tmp/node.tar.xz
    mode: "0644"

- name: Install Node.js to /usr/local/lib/nodejs
  ansible.builtin.unarchive:
    src: /tmp/node.tar.xz
    dest: /usr/local/lib
    remote_src: true

- name: Stable path for the Node.js install
  ansible.builtin.file:
    src: "/usr/local/lib/node-{{ node_resolved }}-linux-{{ node_arch }}"
    dest: /usr/local/lib/nodejs
    state: link

- name: Put node, npm, npx and corepack on PATH
  ansible.builtin.file:
    src: "/usr/local/lib/nodejs/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [node, npm, npx, corepack]

- name: Enable corepack (yarn, pnpm)
  ansible.builtin.command: corepack enable --install-directory /usr/local/bin
  changed_when: true

- name: Remove download
  ansible.builtin.file:
    path: /tmp/node.tar.xz
    state: absent
