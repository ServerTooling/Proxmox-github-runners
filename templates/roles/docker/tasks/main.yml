# Docker inside an unprivileged LXC needs the container features nesting=1,keyctl=1, which
# pve-runners sets on every template it creates.
- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch={{ arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
    mode: "0644"

- name: Install Docker Engine, Buildx and Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    update_cache: true
    install_recommends: false

- name: Start Docker at boot
  ansible.builtin.command: systemctl enable docker containerd
  changed_when: true
