# Runner image that tracks GitHub's `ubuntu-latest` (Ubuntu 24.04 today). Bump `base` in a PR when
# GitHub moves ubuntu-latest to a new release.
name: ubuntu-latest
base: ubuntu:24.04

# Ansible roles from templates/roles, applied in order.
roles:
  - base              # systemd and networking: what an LXC guest needs to boot
  - common            # git, curl, jq, build tools, gh CLI
  - python
  - go
  - node
  - helm
  - kubectl
  - docker
  - playwright_deps   # libraries Playwright's Chromium and Firefox need; runners have no sudo
  - actions_runner    # pinned by packaging/runner-version; the one-job runner service

# Tool versions: "latest"/"lts"/"stable" resolve at build time (recorded in the release's
# template.json), or give an exact version to pin. Role defaults apply to anything left out.
vars:
  go_version: latest
  node_version: lts
  helm_version: latest
  kubectl_version: stable

# Every command must succeed in the built image before it is published, keyed by the role that
# provides it (local builds that skip a role skip its checks). The first output line of each is
# recorded in the release's template.json.
smoke:
  common: [git --version, gh --version, jq --version]
  python: [python3 --version, pip3 --version, pipx --version]
  go: [go version]
  node: [node --version, npm --version]
  helm: [helm version --short]
  kubectl: [kubectl version --client]
  docker: [docker --version]
  playwright_deps: ["dpkg-query -W xvfb libnss3 libgtk-3-0t64 libavcodec60 >/dev/null && echo installed"]
  # As the runner user, like gh-runner.service runs it, so files only root can write fail the build.
  # The unit is installed but disabled: the host starts it once the runner's files are pushed.
  actions_runner: ["su -s /bin/sh runner -c '/opt/actions-runner/bin/Runner.Listener --version'",
    "test \"$(systemctl is-enabled gh-runner.service)\" = disabled && echo installed"]
